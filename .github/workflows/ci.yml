name: CI Build & Lint

on:
  push:
    branches: [ main, idil-frontend ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint:
    name: Backend Check (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Verify Go dependencies & build
        working-directory: backend
        run: |
          go mod download
          go vet ./...

  web-admin-build:
    name: Web Admin Build (React Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      - name: Install & Build
        working-directory: web-admin
        run: |
          npm ci
          npm run build
